<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Microsoft YaHei','SimHei','Noto Sans CJK SC','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <pattern id="lock" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#d9d9d9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.4"/>
    </pattern>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000">事后改装 BLIP-2 与原生多模态预训练 InternVL-3</text>

  <line x1="410" y1="52" x2="410" y2="470" stroke="#d9d9d9" stroke-width="1.5"/>

  <!-- 左 BLIP-2 -->
  <text x="200" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">BLIP-2（事后改装 retrofit）</text>

  <rect x="60" y="92" width="280" height="60" rx="6" fill="url(#lock)" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">冻结的 ViT</text>
  <text x="200" y="138" text-anchor="middle" font-size="12" fill="#333333">（锁定，不更新）</text>

  <line x1="200" y1="154" x2="200" y2="176" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="180" width="280" height="66" rx="6" fill="#000000"/>
  <text x="200" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">仅训练 Q-Former（约 188M）</text>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#ffffff">桥接模块 · 两阶段：表示学习 → 生成学习</text>

  <line x1="200" y1="248" x2="200" y2="270" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="274" width="280" height="60" rx="6" fill="url(#lock)" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">冻结的 LLM</text>
  <text x="200" y="320" text-anchor="middle" font-size="12" fill="#333333">视觉信息仅作软提示外挂注入</text>

  <rect x="60" y="356" width="280" height="46" rx="6" fill="#ffffff" stroke="#595959" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="200" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">对齐债 / 模态鸿沟</text>

  <!-- 右 InternVL-3 -->
  <text x="610" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">InternVL-3（原生 native）</text>

  <rect x="480" y="92" width="125" height="80" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="542" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">纯文本语料</text>
  <text x="542" y="140" text-anchor="middle" font-size="11" fill="#595959">约 500 亿 token</text>

  <rect x="615" y="92" width="145" height="80" rx="6" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="687" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">多模态数据</text>
  <text x="687" y="134" text-anchor="middle" font-size="10.5" fill="#333333">图文 / 视频文本 / 图文交错</text>
  <text x="687" y="152" text-anchor="middle" font-size="11" fill="#595959">约 1500 亿 token</text>

  <line x1="542" y1="174" x2="590" y2="214" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="687" y1="174" x2="630" y2="214" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="480" y="218" width="280" height="80" rx="6" fill="#000000"/>
  <text x="620" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">单阶段联合预训练</text>
  <text x="620" y="270" text-anchor="middle" font-size="12.5" fill="#ffffff">LLM 参与训练 · 无需桥接 / 对齐模块</text>
  <text x="620" y="290" text-anchor="middle" font-size="12.5" fill="#ffffff">视觉与语言从同一起点共同优化</text>

  <rect x="480" y="312" width="280" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="620" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">语言 : 多模态 = 1 : 3</text>
  <text x="620" y="364" text-anchor="middle" font-size="13" fill="#333333">总量约 2000 亿 token</text>
  <text x="620" y="386" text-anchor="middle" font-size="12" fill="#595959">语言≈500亿　+　多模态≈1500亿</text>

  <rect x="60" y="428" width="700" height="44" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="410" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">范式演进：从"事后改装"走向"原生一体"，原生上限更高但成本高、需掌控基座</text>
</svg>
