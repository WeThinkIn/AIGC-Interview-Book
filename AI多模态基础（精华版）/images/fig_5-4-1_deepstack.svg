<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Microsoft YaHei','SimHei','Noto Sans CJK SC','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000">Qwen3-VL DeepStack：跨层抽取 · 投影 · 残差注入（不增 token）</text>

  <text x="150" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">ViT 多层特征</text>
  <rect x="70" y="80" width="160" height="330" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <rect x="86" y="96" width="128" height="60" rx="6" fill="#595959" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">深层 l3</text>
  <text x="150" y="142" text-anchor="middle" font-size="12" fill="#ffffff">高层语义 / 类别</text>
  <rect x="86" y="216" width="128" height="60" rx="6" fill="#bdbdbd" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">中层 l2</text>
  <text x="150" y="262" text-anchor="middle" font-size="12" fill="#333333">中层结构特征</text>
  <rect x="86" y="336" width="128" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">浅层 l1</text>
  <text x="150" y="382" text-anchor="middle" font-size="12" fill="#333333">纹理 / 边缘细节</text>

  <text x="410" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">独立 MLP merger</text>
  <text x="410" y="84" text-anchor="middle" font-size="12" fill="#595959">各层各自投影到 LLM 隐藏维</text>
  <g>
    <rect x="345" y="102" width="130" height="48" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="410" y="131" text-anchor="middle" font-size="13" fill="#000000">MLP merger₃</text>
    <rect x="345" y="222" width="130" height="48" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="410" y="251" text-anchor="middle" font-size="13" fill="#000000">MLP merger₂</text>
    <rect x="345" y="342" width="130" height="48" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="410" y="371" text-anchor="middle" font-size="13" fill="#000000">MLP merger₁</text>
  </g>
  <line x1="214" y1="126" x2="343" y2="126" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="214" y1="246" x2="343" y2="246" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="214" y1="366" x2="343" y2="366" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="680" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">LLM 前 1–3 层</text>
  <rect x="600" y="80" width="160" height="330" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <rect x="616" y="96" width="128" height="60" rx="6" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="680" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">第 3 层</text>
  <rect x="616" y="216" width="128" height="60" rx="6" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="680" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">第 2 层</text>
  <rect x="616" y="336" width="128" height="60" rx="6" fill="#d9d9d9" stroke="#333333" stroke-width="1.5"/>
  <text x="680" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">第 1 层</text>
  <g>
    <circle cx="588" cy="126" r="11" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="588" y="131" text-anchor="middle" font-size="15" fill="#000000">+</text>
    <circle cx="588" cy="246" r="11" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="588" y="251" text-anchor="middle" font-size="15" fill="#000000">+</text>
    <circle cx="588" cy="366" r="11" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="588" y="371" text-anchor="middle" font-size="15" fill="#000000">+</text>
  </g>
  <line x1="475" y1="126" x2="576" y2="126" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="475" y1="246" x2="576" y2="246" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="475" y1="366" x2="576" y2="366" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="540" y="118" text-anchor="middle" font-size="11" fill="#595959">残差相加</text>

  <rect x="70" y="424" width="330" height="34" rx="6" fill="#000000"/>
  <text x="235" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">不增加序列长度（不增 token）</text>
  <rect x="430" y="424" width="330" height="34" rx="6" fill="#ffffff" stroke="#595959" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="595" y="446" text-anchor="middle" font-size="13" fill="#333333">传统做法：只取 ViT 末层特征</text>
</svg>
