<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="980" height="420" rx="24" fill="url(#bg2)"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#e5e7eb" font-weight="700">Image VAE vs Video VAE</text>
  <text x="490" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#93c5fd">space-only compression vs spatiotemporal compression</text>

  <g filter="url(#shadow2)">
    <rect x="70" y="105" width="385" height="240" rx="22" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <text x="262" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e0f2fe" font-weight="700">Image VAE</text>
    <rect x="115" y="175" width="92" height="92" rx="12" fill="#1e40af" stroke="#bfdbfe"/>
    <text x="161" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dbeafe">H x W</text>
    <path d="M225 221 H295" stroke="#93c5fd" stroke-width="3" marker-end="url(#arr2)"/>
    <rect x="315" y="178" width="88" height="86" rx="12" fill="#312e81" stroke="#c4b5fd"/>
    <text x="359" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ede9fe">latent</text>
    <text x="359" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ddd6fe">H' x W'</text>
    <text x="262" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">focus: single-frame reconstruction</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="525" y="105" width="385" height="240" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="717" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#d1fae5" font-weight="700">Video VAE</text>
    <g opacity="0.95">
      <rect x="565" y="190" width="78" height="72" rx="10" fill="#047857" stroke="#a7f3d0"/>
      <rect x="577" y="178" width="78" height="72" rx="10" fill="#059669" stroke="#a7f3d0"/>
      <rect x="589" y="166" width="78" height="72" rx="10" fill="#10b981" stroke="#a7f3d0"/>
    </g>
    <text x="628" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ecfdf5">T x H x W</text>
    <path d="M690 214 H760" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arr3)"/>
    <g>
      <rect x="779" y="190" width="72" height="58" rx="10" fill="#312e81" stroke="#c4b5fd"/>
      <rect x="789" y="180" width="72" height="58" rx="10" fill="#4338ca" stroke="#c4b5fd"/>
    </g>
    <text x="825" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ede9fe">T' x H' x W'</text>
    <text x="717" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bbf7d0">focus: quality + temporal consistency</text>
  </g>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6ee7b7"/>
    </marker>
  </defs>
</svg>
