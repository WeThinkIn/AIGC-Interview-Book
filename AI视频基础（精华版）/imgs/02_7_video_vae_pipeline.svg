<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="980" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#60a5fa" stroke-width="1">
    <path d="M0 70 H980"/>
    <path d="M0 140 H980"/>
    <path d="M0 210 H980"/>
    <path d="M0 280 H980"/>
    <path d="M120 0 V360"/>
    <path d="M240 0 V360"/>
    <path d="M360 0 V360"/>
    <path d="M480 0 V360"/>
    <path d="M600 0 V360"/>
    <path d="M720 0 V360"/>
    <path d="M840 0 V360"/>
  </g>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#e5e7eb" font-weight="700">Video VAE Latent Pipeline</text>
  <text x="490" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#93c5fd">pixel video -> compact latent -> generative backbone -> decoded video</text>

  <g filter="url(#shadow)">
    <rect x="50" y="125" width="170" height="105" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e0f2fe" font-weight="700">Input Video</text>
    <text x="135" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bae6fd">x1:T</text>
    <text x="135" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">T x H x W pixels</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="118" width="155" height="120" rx="18" fill="url(#blue)"/>
    <text x="362.5" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">VAE Encoder</text>
    <text x="362.5" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dbeafe">spatial / temporal</text>
    <text x="362.5" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dbeafe">compression</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="105" width="170" height="145" rx="20" fill="url(#violet)"/>
    <text x="590" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Video Latent</text>
    <text x="590" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ede9fe">z = E(x1:T)</text>
    <text x="590" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ddd6fe">T' x H' x W'</text>
    <text x="590" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ddd6fe">lower token budget</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="118" width="155" height="120" rx="18" fill="url(#green)"/>
    <text x="817.5" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">VAE Decoder</text>
    <text x="817.5" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d1fae5">latent to pixels</text>
    <text x="817.5" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d1fae5">xhat1:T</text>
  </g>

  <line x1="225" y1="178" x2="275" y2="178" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="445" y1="178" x2="495" y2="178" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="178" x2="730" y2="178" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="504" y="274" width="172" height="46" rx="12" fill="#020617" stroke="#64748b"/>
  <text x="590" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Diffusion / Flow model operates here</text>
</svg>
