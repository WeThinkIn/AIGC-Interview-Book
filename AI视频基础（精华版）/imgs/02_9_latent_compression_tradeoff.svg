<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="980" height="420" rx="24" fill="url(#bg3)"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#f8fafc" font-weight="700">Latent Compression Trade-off</text>
  <text x="490" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c4b5fd">higher compression reduces token cost, but may lose visual details and motion fidelity</text>

  <g transform="translate(100,105)">
    <line x1="0" y1="240" x2="760" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="240" x2="0" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <text x="380" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e5e7eb">compression ratio</text>
    <text x="-54" y="120" transform="rotate(-90 -54 120)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e5e7eb">cost / quality</text>
    <text x="0" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">low</text>
    <text x="760" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">high</text>

    <path d="M30 40 C200 70, 400 150, 730 220" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <text x="625" y="205" font-family="Arial, sans-serif" font-size="14" fill="#bae6fd">token cost</text>
    <text x="625" y="225" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">decreases</text>

    <path d="M30 220 C210 190, 420 105, 730 45" fill="none" stroke="#fb923c" stroke-width="5"/>
    <text x="615" y="58" font-family="Arial, sans-serif" font-size="14" fill="#fed7aa">information loss</text>
    <text x="615" y="78" font-family="Arial, sans-serif" font-size="12" fill="#fdba74">increases</text>

    <rect x="300" y="92" width="175" height="70" rx="14" fill="#020617" stroke="#a78bfa" filter="url(#shadow3)"/>
    <text x="387.5" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ede9fe" font-weight="700">sweet spot</text>
    <text x="387.5" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c4b5fd">usable quality + feasible cost</text>
  </g>

  <text x="490" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1">Video VAE design balances spatial detail, temporal fidelity, token budget, and downstream generation stability.</text>
</svg>
